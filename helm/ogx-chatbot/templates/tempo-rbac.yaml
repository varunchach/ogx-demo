{{- if .Values.tempoRbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempo-{{ .Values.tempoRbac.tenant }}-traces-write
  labels:
    {{- include "ogx-chatbot.labels" . | nindent 4 }}
rules:
  - apiGroups: ["tempo.grafana.com"]
    resources: [{{ .Values.tempoRbac.tenant | quote }}]
    resourceNames: ["traces"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-science-collector-tempo-traces-write
  labels:
    {{- include "ogx-chatbot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tempo-{{ .Values.tempoRbac.tenant }}-traces-write
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tempoRbac.collectorServiceAccount }}
    namespace: {{ .Values.tempoRbac.collectorNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempo-{{ .Values.tempoRbac.tenant }}-traces-read
  labels:
    {{- include "ogx-chatbot.labels" . | nindent 4 }}
rules:
  - apiGroups: ["tempo.grafana.com"]
    resources: [{{ .Values.tempoRbac.tenant | quote }}]
    resourceNames: ["traces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authenticated-tempo-traces-read
  labels:
    {{- include "ogx-chatbot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tempo-{{ .Values.tempoRbac.tenant }}-traces-read
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
{{- end }}
