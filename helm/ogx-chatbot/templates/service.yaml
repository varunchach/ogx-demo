apiVersion: v1
kind: Service
metadata:
  name: {{ include "ogx-chatbot.fullname" . }}
  namespace: {{ include "ogx-chatbot.namespace" . }}
  labels:
    {{- include "ogx-chatbot.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ogx-chatbot.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
