apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ogx-chatbot.fullname" . }}
  namespace: {{ include "ogx-chatbot.namespace" . }}
  labels:
    {{- include "ogx-chatbot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ogx-chatbot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ogx-chatbot.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ogx-chatbot.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: PYTHONPATH
              value: /opt/app-root/src
          envFrom:
            - secretRef:
                name: {{ include "ogx-chatbot.fullname" . }}-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # Lightweight only — ingest blocks a worker thread, not this probe path.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
