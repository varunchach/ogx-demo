{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "ogx-chatbot.fullname" . }}
  namespace: {{ include "ogx-chatbot.namespace" . }}
  labels:
    {{- include "ogx-chatbot.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: {{ include "ogx-chatbot.fullname" . }}
  port:
    targetPort: http
  tls:
    termination: {{ .Values.route.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy }}
{{- end }}
