# Enables Observe → Traces in the OpenShift console (Cluster Observability Operator).
# Tempo itself is already provided by RHOAI (data-science-tempomonolithic).
apiVersion: observability.openshift.io/v1alpha1
kind: UIPlugin
metadata:
  name: distributed-tracing
spec:
  type: DistributedTracing
  distributedTracing:
    timeout: "30s"
