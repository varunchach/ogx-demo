# Single app Deployment for OpenShift AI 3.5.
# Prerequisites (dashboard / Operators — NOT installed here):
#   OgxServer + MaaS LLM/embed, MLflow, EvalHub, Tempo collector.
# Create Secret ogx-chatbot-secrets first (or use manifests/app.yaml).
# Image: quay.io/vraste/ogx-chatbot:1.2.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ogx-chatbot
  labels:
    app: ogx-chatbot
    app.kubernetes.io/part-of: ogx-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ogx-chatbot
  template:
    metadata:
      labels:
        app: ogx-chatbot
        app.kubernetes.io/part-of: ogx-chatbot
    spec:
      imagePullSecrets:
        - name: quay-creds
      containers:
        - name: app
          image: quay.io/vraste/ogx-chatbot:1.4.20
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PYTHONPATH
              value: /opt/app-root/src
          envFrom:
            - secretRef:
                name: ogx-chatbot-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
