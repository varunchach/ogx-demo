# EXAMPLE ONLY — fuse customer cluster values. Do not commit real tokens.
#
# Platform-only (OpenShift AI 3.5): paste URLs/creds from EXISTING CRs —
#   OgxServer, MLflow operator, EvalHub route, RHOAI data-science-collector.
# RAG uses OGX Files + Vector Stores — do NOT add PGVECTOR_* / DATABASE_URL.
#
apiVersion: v1
kind: Secret
metadata:
  name: ogx-chatbot-secrets
  labels:
    app: ogx-chatbot
    app.kubernetes.io/part-of: ogx-chatbot
type: Opaque
stringData:
  OGX_BASE_URL: "http://REPLACE_OGX_SERVICE.<ns>.svc.cluster.local:8321"
  OGX_API_KEY: "REPLACE_MAAS_OR_OGX_TOKEN"
  OGX_MODEL: "REPLACE_CHAT_MODEL_ID"
  OGX_EMBEDDING_MODEL: "REPLACE_BGE_OR_OGX_EMBED_MODEL"
  OGX_VECTOR_STORE_NAME: "ogx-rag-demo"
  OGX_VECTOR_PROVIDER_ID: "pgvector"
  OGX_TIMEOUT_SECONDS: "180"
  CHUNK_SIZE_TOKENS: "512"
  CHUNK_OVERLAP_TOKENS: "128"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://data-science-collector-collector.redhat-ods-monitoring.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_SERVICE_NAME: "ogx-chatbot-api"
  MLFLOW_TRACKING_URI: "https://mlflow.redhat-ods-applications.svc:8443/mlflow"
  MLFLOW_TRACKING_INSECURE_TLS: "true"
  MLFLOW_EXPERIMENT_NAME: "ogx-chatbot"
  MLFLOW_WORKSPACE: "REPLACE_PROJECT"
  EVALHUB_BASE_URL: "https://evalhub-redhat-ods-applications.apps.REPLACE.example.com"
  EVALHUB_API_TOKEN: ""
  EVALHUB_PROVIDERS: "ragas,lm-evaluation-harness,garak"
  # Live RAGAS-style scores via OGX LLM-as-judge (EvalHub cannot score chat turns)
  RAG_EVAL_ON_CHAT: "true"
  RAG_EVAL_REQUIRE_CONTEXTS: "true"
  # --- Standalone NeMo Guardrails (TrustyAI NemoGuardrails CR) — checks BEFORE OGX ---
  # Do NOT point OGX_BASE_URL at NeMo. Route host only (no /v1/guardrail/checks suffix).
  GUARDRAILS_ENABLED: "true"
  GUARDRAILS_BASE_URL: "https://nemo-standalone-ogx-demo.apps.ocp-dwh-np.bajajlife.com"
  # Optional — leave empty unless the NeMo Route requires Bearer auth
  GUARDRAILS_API_TOKEN: ""
  GUARDRAILS_INSECURE_TLS: "true"
  GUARDRAILS_TIMEOUT_SECONDS: "60"
