# Allow RHOAI data-science collector to write traces into Tempo tenant.
# Without this, collector logs: PermissionDenied desc = forbidden
# and Observe → Traces stays empty.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempo-redhat-ods-monitoring-traces-write
  labels:
    app.kubernetes.io/part-of: ogx-chatbot-lab
rules:
  - apiGroups: ["tempo.grafana.com"]
    resources: ["redhat-ods-monitoring"]
    resourceNames: ["traces"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-science-collector-tempo-traces-write
  labels:
    app.kubernetes.io/part-of: ogx-chatbot-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tempo-redhat-ods-monitoring-traces-write
subjects:
  - kind: ServiceAccount
    name: data-science-collector-collector
    namespace: redhat-ods-monitoring
---
# Console Observe → Traces read access for the same tenant
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tempo-redhat-ods-monitoring-traces-read
  labels:
    app.kubernetes.io/part-of: ogx-chatbot-lab
rules:
  - apiGroups: ["tempo.grafana.com"]
    resources: ["redhat-ods-monitoring"]
    resourceNames: ["traces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authenticated-tempo-traces-read
  labels:
    app.kubernetes.io/part-of: ogx-chatbot-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tempo-redhat-ods-monitoring-traces-read
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
