apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ogx-chatbot.fullname" . }}-secrets
  namespace: {{ include "ogx-chatbot.namespace" . }}
  labels:
    {{- include "ogx-chatbot.labels" . | nindent 4 }}
type: Opaque
stringData:
  OGX_BASE_URL: {{ .Values.config.ogx.baseUrl | quote }}
  OGX_API_KEY: {{ .Values.config.ogx.apiKey | quote }}
  OGX_MODEL: {{ .Values.config.ogx.model | quote }}
  OGX_EMBEDDING_MODEL: {{ .Values.config.ogx.embeddingModel | quote }}
  OGX_EMBEDDING_DIMENSION: {{ .Values.config.ogx.embeddingDimension | default "1024" | quote }}
  OGX_EMBED_BATCH_SIZE: {{ .Values.config.ogx.embedBatchSize | default "16" | quote }}
  OGX_VECTOR_STORE_NAME: {{ .Values.config.ogx.vectorStoreName | quote }}
  OGX_VECTOR_PROVIDER_ID: {{ .Values.config.ogx.vectorProviderId | quote }}
  OGX_TIMEOUT_SECONDS: {{ .Values.config.ogx.timeoutSeconds | quote }}
  CHUNK_SIZE_TOKENS: {{ .Values.config.chunking.sizeTokens | quote }}
  CHUNK_OVERLAP_TOKENS: {{ .Values.config.chunking.overlapTokens | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.config.otel.protocol | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.otel.serviceName | quote }}
  MLFLOW_TRACKING_URI: {{ .Values.config.mlflow.trackingUri | quote }}
  MLFLOW_TRACKING_INSECURE_TLS: {{ .Values.config.mlflow.insecureTls | quote }}
  MLFLOW_EXPERIMENT_NAME: {{ .Values.config.mlflow.experimentName | quote }}
  MLFLOW_WORKSPACE: {{ .Values.config.mlflow.workspace | default (include "ogx-chatbot.namespace" .) | quote }}
  EVALHUB_BASE_URL: {{ .Values.config.evalhub.baseUrl | quote }}
  EVALHUB_API_TOKEN: {{ .Values.config.evalhub.apiToken | quote }}
  EVALHUB_PROVIDERS: {{ .Values.config.evalhub.providers | quote }}
  RAG_EVAL_ON_CHAT: {{ .Values.config.ragEval.onChat | quote }}
  RAG_EVAL_REQUIRE_CONTEXTS: {{ .Values.config.ragEval.requireContexts | quote }}
  GUARDRAILS_ENABLED: {{ .Values.config.guardrails.enabled | quote }}
  GUARDRAILS_BASE_URL: {{ .Values.config.guardrails.baseUrl | quote }}
  GUARDRAILS_API_TOKEN: {{ .Values.config.guardrails.apiToken | quote }}
  GUARDRAILS_INSECURE_TLS: {{ .Values.config.guardrails.insecureTls | quote }}
  GUARDRAILS_TIMEOUT_SECONDS: {{ .Values.config.guardrails.timeoutSeconds | quote }}
